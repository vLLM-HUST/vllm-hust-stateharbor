[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-hust-stateharbor"
version = "0.1.0.dev0"
description = "Import-only research descriptor for the StateHarbor request-owned runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Jingyuan Tian"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateharbor" = "vllm_hust_stateharbor"

[project.urls]
Repository = "https://github.com/vLLM-HUST/vllm-hust-stateharbor"
Issues = "https://github.com/vLLM-HUST/vllm-hust-stateharbor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_hust_stateharbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
